# Verify Which Repository Built A Public Image
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-120-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs the registry, the private Sigstore stack and the workstation, and builds the trust files"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-120-capstone-030-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the workstation answer"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-accepts-source-controller"
      description: "Confirms the script accepts source-controller v1.9.6"
      type: "file"
      source: "validation/validate-accepts-source-controller.sh"
    - name: "validate-rejects-other-repository"
      description: "Confirms the script rejects kustomize-controller v1.9.6"
      type: "file"
      source: "validation/validate-rejects-other-repository.sh"
    - name: "validate-issuer-pinned"
      description: "Confirms the script pins the GitHub Actions issuer"
      type: "file"
      source: "validation/validate-issuer-pinned.sh"

teardown:
  keepCluster: false
