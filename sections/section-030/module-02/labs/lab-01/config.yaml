# Read And Check An Attestation
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-120-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs the registry, the private Sigstore stack and the workstation, and builds the trust files"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-120-lab-030-02-setup"
      description: "Attests a scan result about the release image"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the workstation answer"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-findings"
      description: "Confirms attestation-findings holds the image digest and the critical count of the attestation"
      type: "file"
      source: "validation/validate-findings.sh"
    - name: "validate-signer-pinned"
      description: "Confirms the attestation verifies for the workstation and for no other identity"
      type: "file"
      source: "validation/validate-signer-pinned.sh"
    - name: "validate-findings-signer"
      description: "Confirms attestation-findings names the signer identity"
      type: "file"
      source: "validation/validate-findings-signer.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - ghcr.io/sigstore/cosign/cosign:v3.1.4
      - registry:3.1.2
---
estimated_duration: 20m
---
