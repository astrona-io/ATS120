# Repair A Verifier's Trusted Root
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-120-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs the registry, the private Sigstore stack and the workstation, and builds the trust files"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-120-lab-010-03-setup"
      description: "Publishes a release bundle and a broken verifier trust file"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the workstation answer"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-verifies"
      description: "Confirms the bundle verifies with the trusted root in verifier-trust"
      type: "file"
      source: "validation/validate-verifies.sh"
    - name: "validate-root-complete"
      description: "Confirms the trusted root has all lists and no ended Rekor or CT key"
      type: "file"
      source: "validation/validate-root-complete.sh"
    - name: "validate-bundle-unchanged"
      description: "Confirms the published bundle was not replaced"
      type: "file"
      source: "validation/validate-bundle-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - ghcr.io/sigstore/cosign/cosign:v3.1.4
      - registry:3.1.2
---
estimated_duration: 25m
---
