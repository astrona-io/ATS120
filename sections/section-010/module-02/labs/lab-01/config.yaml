# Find The Rekor Entry Of A Release Signature
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-120-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs the registry, the private Sigstore stack and the workstation, and builds the trust files"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-120-lab-010-02-setup"
      description: "Signs the release file and publishes its bundle"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the workstation answer"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-log-index"
      description: "Confirms rekor-findings has the log index of the bundle and that Rekor has the entry"
      type: "file"
      source: "validation/validate-log-index.sh"
    - name: "validate-identity"
      description: "Confirms rekor-findings has the signer identity from the bundle certificate"
      type: "file"
      source: "validation/validate-identity.sh"
    - name: "validate-bundle-unchanged"
      description: "Confirms the published bundle still verifies"
      type: "file"
      source: "validation/validate-bundle-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - ghcr.io/sigstore/cosign/cosign:v3.1.4
      - registry:3.1.2
---
estimated_duration: 20m
---
