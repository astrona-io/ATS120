# Find Why Three Signers Failed
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-120-lab-040-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs the registry, the private Sigstore stack and the workstation, and builds the trust files"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-120-lab-040-03-setup"
      description: "Creates three signing Jobs that fail for different reasons"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the workstation answer"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-report"
      description: "Confirms failure-report names the right cause for each Job"
      type: "file"
      source: "validation/validate-report.sh"
    - name: "validate-jobs-kept"
      description: "Confirms the three Jobs still exist so the evidence is intact"
      type: "file"
      source: "validation/validate-jobs-kept.sh"
    - name: "validate-no-signature"
      description: "Confirms nobody worked around the failures by signing as another identity"
      type: "file"
      source: "validation/validate-no-signature.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - ghcr.io/sigstore/cosign/cosign:v3.1.4
      - registry:3.1.2
---
estimated_duration: 25m
---
