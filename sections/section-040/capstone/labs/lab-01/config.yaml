# Move A Pipeline From A Signing Key To Keyless
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-120-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-sigstore"
      description: "Installs the registry, the private Sigstore stack and the workstation, and builds the trust files"
      type: "file"
      source: "bootstrap/01-install-sigstore.sh"
    - name: "ats-120-capstone-040-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-sigstore"
      description: "Waits until Fulcio, Rekor and the workstation answer"
      type: "file"
      source: "testing/wait-for-sigstore.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-key-gone"
      description: "Confirms no Secret or Job holds the signing key"
      type: "file"
      source: "validation/validate-key-gone.sh"
    - name: "validate-signature"
      description: "Confirms the release digest verifies for ci/ci-builder"
      type: "file"
      source: "validation/validate-signature.sh"
    - name: "validate-verify-script"
      description: "Confirms verify-release.sh verifies keylessly and pins ci-builder"
      type: "file"
      source: "validation/validate-verify-script.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - ghcr.io/sigstore/cosign/cosign:v3.1.4
      - registry:3.1.2
