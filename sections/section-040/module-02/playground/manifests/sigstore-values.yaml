# Helm values for the private Sigstore stack (chart scaffold 0.6.117).
# The bootstrap adds a second values file with Fulcio's OIDC issuers, because
# the issuer URL is read from the running cluster.
fulcio:
  server:
    # Without a mounted token, Fulcio fetches the cluster's discovery document
    # and JWKS anonymously. With one, Fulcio v1.9.0 refuses JWKS URLs on a
    # different host than the issuer, which is the case on kind.
    serviceAccount:
      mountToken: false
    ingress:
      http:
        enabled: false
rekor:
  server:
    ingress:
      enabled: false
# MySQL 5.7 runs out of memory on newer kind nodes; use the MySQL 8.4 image
# and probes from the sigstore/helm-charts CI values.
trillian:
  mysql:
    image:
      # db_server:v1.7.3 (MySQL 8.4)
      version: sha256:763dfa45405724b466dbaf980d0410e170019afd8747650b8af878538dcea1e2
    args: []
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 256Mi
    livenessProbe:
      exec:
        command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
      initialDelaySeconds: 90
      timeoutSeconds: 5
    readinessProbe:
      exec:
        command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
      timeoutSeconds: 5
