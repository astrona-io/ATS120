# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats120-040
course_id: ATS120
exam_code: SIGSTORE
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Keyless Signing In CI"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats120-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how a GitHub Actions job gets an ID token"
    source_readings:
      - sections/section-040/module-01/course-01-keyless-signing-in-github-actions.md
    prompt: "Which workflow permission lets a job request an ID token for keyless signing?"
    options:
      - id: a
        text: "contents: write"
        explanation: "Not correct. It lets the job write to the repository."
      - id: b
        text: "packages: write"
        explanation: "Not correct. It lets the job push to a package registry."
      - id: c
        text: "actions: read"
        explanation: "Not correct. It lets the job read workflow runs."
      - id: d
        text: "id-token: write"
        explanation: "Correct. It only allows the job to request a token."
    correct_option: d
    explanation: "Correct. It only allows the job to request a token."

  - id: ats120-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit the id-token permission"
    source_readings:
      - sections/section-040/module-01/course-01-keyless-signing-in-github-actions.md
    prompt: "Where should id-token: write be granted?"
    options:
      - id: a
        text: "Only to the job that signs."
        explanation: "Correct. Other jobs then cannot get a signing identity."
      - id: b
        text: "To every job, so all steps can sign."
        explanation: "Not correct. This gives every job a signing identity."
      - id: c
        text: "To pull request code from forks."
        explanation: "Not correct. Untrusted code with this permission can sign as your workflow."
      - id: d
        text: "Nowhere, because secrets.GITHUB_TOKEN signs images."
        explanation: "Not correct. GITHUB_TOKEN is not a signing key."
    correct_option: a
    explanation: "Correct. Other jobs then cannot get a signing identity."

  - id: ats120-040-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose what to sign"
    source_readings:
      - sections/section-040/module-01/course-01-keyless-signing-in-github-actions.md
    prompt: "What should the signing step in the workflow sign?"
    options:
      - id: a
        text: "The tag, after the push."
        explanation: "Not correct. A tag can be moved after the push."
      - id: b
        text: "The digest the build step reported."
        explanation: "Correct. The signature covers exactly what was built."
      - id: c
        text: "The workflow file."
        explanation: "Not correct. The image is the artifact to sign."
      - id: d
        text: "The repository URL."
        explanation: "Not correct. A URL is not an artifact."
    correct_option: b
    explanation: "Correct. The signature covers exactly what was built."

  - id: ats120-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the identity of a workflow signature"
    source_readings:
      - sections/section-040/module-01/course-01-keyless-signing-in-github-actions.md
    prompt: "What is the issuer of a certificate made in a GitHub Actions job?"
    options:
      - id: a
        text: "https://github.com"
        explanation: "Not correct. That is the site, not the issuer URL."
      - id: b
        text: "https://kubernetes.default.svc.cluster.local"
        explanation: "Not correct. That is a Kubernetes cluster issuer."
      - id: c
        text: "https://token.actions.githubusercontent.com"
        explanation: "Correct. This is the issuer URL of the GitHub OIDC provider."
      - id: d
        text: "https://rekor.sigstore.dev"
        explanation: "Not correct. That is a transparency log."
    correct_option: c
    explanation: "Correct. This is the issuer URL of the GitHub OIDC provider."

  - id: ats120-040-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Verify the release build"
    source_readings:
      - sections/section-040/module-01/course-01-keyless-signing-in-github-actions.md
    prompt: "Which check proves an image was built from the run for the tag v1.9.6?"
    options:
      - id: a
        text: "--certificate-github-workflow-ref=refs/tags/v1.9.6"
        explanation: "Correct. It checks the git reference claim."
      - id: b
        text: "--certificate-oidc-issuer-regexp='.*'"
        explanation: "Not correct. That accepts every issuer."
      - id: c
        text: "--allow-http-registry"
        explanation: "Not correct. It does not check a reference."
      - id: d
        text: "--certificate-identity-regexp='^https://github\\.com/'"
        explanation: "Not correct. It accepts any GitHub workflow."
    correct_option: a
    explanation: "Correct. It checks the git reference claim."

  - id: ats120-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify in the same run"
    source_readings:
      - sections/section-040/module-01/course-02-a-kubernetes-job-as-the-ci-signer.md
    prompt: "Why does the release Job verify the signature in the same run?"
    options:
      - id: a
        text: "Verifying makes the certificate valid for longer."
        explanation: "Not correct. The validity does not change."
      - id: b
        text: "A Job can succeed while signing as the wrong identity, and the verify step stops the pipeline."
        explanation: "Correct. The verify step uses the identity the deployment demands."
      - id: c
        text: "Verifying uploads the signature to Rekor."
        explanation: "Not correct. Signing uploads it."
      - id: d
        text: "cosign sign does not work without a verify step."
        explanation: "Not correct. Signing works alone. The check is a safeguard."
    correct_option: b
    explanation: "Correct. The verify step uses the identity the deployment demands."

  - id: ats120-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Give each step what it needs"
    source_readings:
      - sections/section-040/module-01/course-02-a-kubernetes-job-as-the-ci-signer.md
    prompt: "Which container of the release Job gets the projected token?"
    options:
      - id: a
        text: "Only the verify container."
        explanation: "Not correct. Verifying needs only the trusted root and the issuer."
      - id: b
        text: "Both containers."
        explanation: "Not correct. The verify step does not need the token."
      - id: c
        text: "Only the signing container."
        explanation: "Correct. Verifying needs no identity."
      - id: d
        text: "Neither, because the token is stored in a Secret."
        explanation: "Not correct. There is no Secret."
    correct_option: c
    explanation: "Correct. Verifying needs no identity."

  - id: ats120-040-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use one source for the digest"
    source_readings:
      - sections/section-040/module-01/course-02-a-kubernetes-job-as-the-ci-signer.md
    prompt: "Why do both containers read the image from the ConfigMap release-info?"
    options:
      - id: a
        text: "A ConfigMap is faster than a registry."
        explanation: "Not correct. Speed is not the reason."
      - id: b
        text: "cosign can only read images from a ConfigMap."
        explanation: "Not correct. cosign reads from registries."
      - id: c
        text: "The ConfigMap stores the signing key."
        explanation: "Not correct. The ConfigMap holds the image name."
      - id: d
        text: "The signed and the verified image are then the same digest."
        explanation: "Correct. One source avoids a mismatch."
    correct_option: d
    explanation: "Correct. One source avoids a mismatch."

  - id: ats120-040-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe the credential of a keyless pipeline"
    source_readings:
      - sections/section-040/module-01/course-02-a-kubernetes-job-as-the-ci-signer.md
    prompt: "Which credential does the keyless release Job hold?"
    options:
      - id: a
        text: "A password in a Secret."
        explanation: "Not correct. The Job has no Secret."
      - id: b
        text: "A projected token that expires after ten minutes."
        explanation: "Correct. It is the only credential and it is short-lived."
      - id: c
        text: "A private key file in an emptyDir."
        explanation: "Not correct. No key file exists."
      - id: d
        text: "A long-lived GitHub token."
        explanation: "Not correct. The Job runs in Kubernetes, and the token is the service account token."
    correct_option: b
    explanation: "Correct. It is the only credential and it is short-lived."

  - id: ats120-040-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Migrate from a key to keyless"
    source_readings:
      - sections/section-040/module-01/course-02-a-kubernetes-job-as-the-ci-signer.md
    prompt: "The keyless signer works. What should you do with the old signing key?"
    options:
      - id: a
        text: "Keep it for safety as a second signer."
        explanation: "Not correct. A kept key can leak and still sign."
      - id: b
        text: "Move it into the ConfigMap release-info."
        explanation: "Not correct. That would expose it."
      - id: c
        text: "Remove it, because a key that still exists can still sign."
        explanation: "Correct. Delete the Secret and the legacy Job."
      - id: d
        text: "Use it as the verify key forever."
        explanation: "Not correct. The new check is keyless and uses no key."
    correct_option: c
    explanation: "Correct. Delete the Secret and the legacy Job."

  - id: ats120-040-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Limit the id-token permission"
    source_readings:
      - sections/section-040/module-01/course-03-protecting-the-signing-step.md
    prompt: "Where should id-token: write be set in a GitHub Actions workflow?"
    options:
      - id: a
        text: "On the signing job only."
        explanation: "Correct. On the signing job only."
      - id: b
        text: "On every job"
        explanation: "Not correct. The correct answer is: On the signing job only."
      - id: c
        text: "Only in the repository settings"
        explanation: "Not correct. The correct answer is: On the signing job only."
      - id: d
        text: "In the cosign command"
        explanation: "Not correct. The correct answer is: On the signing job only."
    correct_option: a
    explanation: "Correct. On the signing job only."

  - id: ats120-040-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pin third-party actions"
    source_readings:
      - sections/section-040/module-01/course-03-protecting-the-signing-step.md
    prompt: "Why pin a third-party action to a commit hash in the signing job?"
    options:
      - id: a
        text: "A hash makes the workflow run faster."
        explanation: "Not correct. The correct answer is: A tag can move to new code that then receives the ID token."
      - id: b
        text: "Tags are not allowed in workflows."
        explanation: "Not correct. The correct answer is: A tag can move to new code that then receives the ID token."
      - id: c
        text: "A hash replaces the permission block."
        explanation: "Not correct. The correct answer is: A tag can move to new code that then receives the ID token."
      - id: d
        text: "A tag can move to new code that then receives the ID token."
        explanation: "Correct. A tag can move to new code that then receives the ID token."
    correct_option: d
    explanation: "Correct. A tag can move to new code that then receives the ID token."

  - id: ats120-040-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify a GitHub Actions signature"
    source_readings:
      - sections/section-040/module-01/course-04-verifying-a-ci-signature-at-deploy.md
    prompt: "Which issuer do you pin when verifying a GitHub Actions signature?"
    options:
      - id: a
        text: "https://accounts.google.com"
        explanation: "Not correct. The correct answer is: https://token.actions.githubusercontent.com"
      - id: b
        text: "https://gitlab.com"
        explanation: "Not correct. The correct answer is: https://token.actions.githubusercontent.com"
      - id: c
        text: "https://token.actions.githubusercontent.com"
        explanation: "Correct. https://token.actions.githubusercontent.com"
      - id: d
        text: "https://github.com"
        explanation: "Not correct. The correct answer is: https://token.actions.githubusercontent.com"
    correct_option: c
    explanation: "Correct. https://token.actions.githubusercontent.com"

  - id: ats120-040-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Anchor a regular expression"
    source_readings:
      - sections/section-040/module-01/course-04-verifying-a-ci-signature-at-deploy.md
    prompt: "Why anchor a regular expression for the ref with ^ and $?"
    options:
      - id: a
        text: "Anchors remove the need for the issuer."
        explanation: "Not correct. The correct answer is: Without anchors, a longer string that contains the pattern also passes."
      - id: b
        text: "Without anchors, a longer string that contains the pattern also passes."
        explanation: "Correct. Without anchors, a longer string that contains the pattern also passes."
      - id: c
        text: "Anchors make cosign faster."
        explanation: "Not correct. The correct answer is: Without anchors, a longer string that contains the pattern also passes."
      - id: d
        text: "Anchors are required by Fulcio."
        explanation: "Not correct. The correct answer is: Without anchors, a longer string that contains the pattern also passes."
    correct_option: b
    explanation: "Correct. Without anchors, a longer string that contains the pattern also passes."

  - id: ats120-040-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe an issuer entry"
    source_readings:
      - sections/section-040/module-02/course-01-how-fulcio-decides-which-issuers-to-trust.md
    prompt: "What does the type of a Fulcio issuer entry decide?"
    options:
      - id: a
        text: "How the token's claims become the certificate subject and extensions."
        explanation: "Correct. How the token's claims become the certificate subject and extensions."
      - id: b
        text: "How long the certificate lives."
        explanation: "Not correct. The correct answer is: How the token's claims become the certificate subject and extensions."
      - id: c
        text: "Which registry stores the signature."
        explanation: "Not correct. The correct answer is: How the token's claims become the certificate subject and extensions."
      - id: d
        text: "Which Rekor shard is used."
        explanation: "Not correct. The correct answer is: How the token's claims become the certificate subject and extensions."
    correct_option: a
    explanation: "Correct. How the token's claims become the certificate subject and extensions."

  - id: ats120-040-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the issuers of a Fulcio"
    source_readings:
      - sections/section-040/module-02/course-01-how-fulcio-decides-which-issuers-to-trust.md
    prompt: "Which Fulcio endpoint lists the configuration, including the issuers?"
    options:
      - id: a
        text: "/api/v2/signingCert"
        explanation: "Not correct. The correct answer is: /api/v2/configuration"
      - id: b
        text: "/api/v2/trustBundle"
        explanation: "Not correct. The correct answer is: /api/v2/configuration"
      - id: c
        text: "/healthz"
        explanation: "Not correct. The correct answer is: /api/v2/configuration"
      - id: d
        text: "/api/v2/configuration"
        explanation: "Correct. /api/v2/configuration"
    correct_option: d
    explanation: "Correct. /api/v2/configuration"

  - id: ats120-040-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use GitLab id_tokens"
    source_readings:
      - sections/section-040/module-02/course-02-gitlab-ci-identities.md
    prompt: "Which variable does cosign read the token from in a GitLab CI job configured with id_tokens as above?"
    options:
      - id: a
        text: "CI_JOB_TOKEN"
        explanation: "Not correct. The correct answer is: SIGSTORE_ID_TOKEN"
      - id: b
        text: "GITLAB_TOKEN"
        explanation: "Not correct. The correct answer is: SIGSTORE_ID_TOKEN"
      - id: c
        text: "SIGSTORE_ID_TOKEN"
        explanation: "Correct. SIGSTORE_ID_TOKEN"
      - id: d
        text: "COSIGN_PASSWORD"
        explanation: "Not correct. The correct answer is: SIGSTORE_ID_TOKEN"
    correct_option: c
    explanation: "Correct. SIGSTORE_ID_TOKEN"

  - id: ats120-040-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "Discover and pin"
    source_readings:
      - sections/section-040/module-02/course-03-reading-the-issuer-and-subject-of-any-signature.md
    prompt: "What is the right use of cosign verify with .* for the identity and the issuer?"
    options:
      - id: a
        text: "A way to skip the transparency log."
        explanation: "Not correct. The correct answer is: Discovery for reading only, never as the check."
      - id: b
        text: "Discovery for reading only, never as the check."
        explanation: "Correct. Discovery for reading only, never as the check."
      - id: c
        text: "A permanent check in the deploy script."
        explanation: "Not correct. The correct answer is: Discovery for reading only, never as the check."
      - id: d
        text: "A faster check for production."
        explanation: "Not correct. The correct answer is: Discovery for reading only, never as the check."
    correct_option: b
    explanation: "Correct. Discovery for reading only, never as the check."

  - id: ats120-040-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Plan a migration from keys"
    source_readings:
      - sections/section-040/module-03/course-01-planning-the-move-from-keys-to-keyless.md
    prompt: "Which step comes last when moving from a signing key to keyless?"
    options:
      - id: a
        text: "Deleting the key everywhere."
        explanation: "Correct. Deleting the key everywhere."
      - id: b
        text: "Adding the keyless signer"
        explanation: "Not correct. The correct answer is: Deleting the key everywhere."
      - id: c
        text: "Signing with both methods"
        explanation: "Not correct. The correct answer is: Deleting the key everywhere."
      - id: d
        text: "Moving the verifiers"
        explanation: "Not correct. The correct answer is: Deleting the key everywhere."
    correct_option: a
    explanation: "Correct. Deleting the key everywhere."

  - id: ats120-040-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Read a failed signing Job"
    source_readings:
      - sections/section-040/module-03/course-03-reading-the-failures-of-a-signing-job.md
    prompt: "A signing Job has no pods. Where do you look for the cause?"
    options:
      - id: a
        text: "In the log of the Fulcio pod only."
        explanation: "Not correct. The correct answer is: In the events of the Job, for example a missing service account."
      - id: b
        text: "In the Rekor log."
        explanation: "Not correct. The correct answer is: In the events of the Job, for example a missing service account."
      - id: c
        text: "In the trusted root."
        explanation: "Not correct. The correct answer is: In the events of the Job, for example a missing service account."
      - id: d
        text: "In the events of the Job, for example a missing service account."
        explanation: "Correct. In the events of the Job, for example a missing service account."
    correct_option: d
    explanation: "Correct. In the events of the Job, for example a missing service account."
