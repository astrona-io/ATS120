# Course manifest for ATS120 - Keyless Signing With Fulcio & OIDC (Sigstore).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS120
  title: "Sigstore: Keyless Signing With Fulcio & OIDC"
  maturity: draft
  description: >
    Training material covering the Keyless Signing With Fulcio & OIDC domain
    of the Sigstore training path: how keyless signing works, OIDC identity
    tokens, the short-lived certificates Fulcio issues and the identity they
    carry, signing as a Kubernetes workload identity, verifying identities and
    issuers precisely, GitHub Actions identities, and keyless signing in CI
    jobs without long-lived keys. Each module pairs a layered reader with an
    ungraded hands-on playground and a graded practice lab, on a private
    Sigstore stack in the cluster. Each section closes with an integration
    capstone. Written for cosign v3.1.4.

  certification:
    name: Sigstore
    code: SIGSTORE
    provider: Astrona
    domain: Keyless Signing With Fulcio & OIDC
    weight: 25

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "How Keyless Signing Works"
    description: >
      The keyless flow from start to end: an ephemeral key, an OIDC identity
      token, the short-lived certificate Fulcio issues for it, the
      certificate transparency log, and the Rekor entry that keeps the
      signature valid after the certificate expires.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Sign Without A Long-Lived Key"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "From Long-Lived Keys To Short-Lived Certificates"
        path: sections/section-010/module-01/course-01-from-keys-to-certificates.md
      - type: reading
        title: "Reading An OIDC Identity Token"
        path: sections/section-010/module-01/course-02-reading-an-oidc-token.md
      - type: reading
        title: "What Fulcio Puts In A Certificate"
        path: sections/section-010/module-01/course-03-what-fulcio-puts-in-a-certificate.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Sign A Release File Keylessly And Publish Its Bundle Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: keyless-flow
        task_kind: build
        tags: [keyless, sign-blob, bundle, fulcio-certificate, san, verify-blob, rekor]
        learning_goals:
          - Sign a file keylessly with the workstation's projected token
          - Publish the Sigstore bundle so others can verify the file
          - Prove the bundle verifies for the workstation identity and for no other
        resources:
          - name: "Signing blobs with cosign"
            url: https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
          - name: "The Sigstore bundle format"
            url: https://docs.sigstore.dev/about/bundle/
          - name: "Certificate authority overview"
            url: https://docs.sigstore.dev/certificate_authority/overview/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair A Keyless Signing Setup Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 35m
        topic: oidc
        task_kind: troubleshooting
        tags: [token-audience, projected-token, signing-config, keyless, bundle, verify-blob]
        learning_goals:
          - Find why Fulcio refuses a token from the token's own claims
          - Repair the signing configuration and the token audience without new trust files
          - Replace a key-based bundle with a keyless one that verifies for the workstation
        resources:
          - name: "OIDC usage in Fulcio"
            url: https://docs.sigstore.dev/certificate_authority/oidc-in-fulcio/
          - name: "Projected volumes: service account tokens"
            url: https://kubernetes.io/docs/concepts/storage/projected-volumes/

