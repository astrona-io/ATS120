# Course manifest for ATS120 - Keyless Signing With Fulcio & OIDC (Sigstore).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS120
  title: "Sigstore: Keyless Signing With Fulcio & OIDC"
  maturity: draft
  description: >
    Training material covering the Keyless Signing With Fulcio & OIDC domain
    of the Sigstore training path: how keyless signing works, OIDC identity
    tokens, the short-lived certificates Fulcio issues and the identity they
    carry, signing as a Kubernetes workload identity, verifying identities and
    issuers precisely, GitHub Actions identities, and keyless signing in CI
    jobs without long-lived keys. Each module pairs a layered reader with an
    ungraded hands-on playground and a graded practice lab, on a private
    Sigstore stack in the cluster. Each section closes with an integration
    capstone. Written for cosign v3.1.4.

  certification:
    name: Sigstore
    code: SIGSTORE
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "How Keyless Signing Works"
    description: >
      The keyless flow from start to end: an ephemeral key, an OIDC identity
      token, the short-lived certificate Fulcio issues for it, the
      certificate transparency log, and the Rekor entry that keeps the
      signature valid after the certificate expires. Also the request Fulcio
      receives, the certificate chain, the signed certificate timestamp, how
      to read a Rekor entry, and the trusted root and signing configuration
      a verifier relies on.

